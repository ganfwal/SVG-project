<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <title>SVG</title>
</head>
<body>
    <svg
    viewBox="0 0 600 250"
    height="400"
    width="500">
        <rect
        class="sign animate__animated animate__pulse animate__infinite"
        x="50"
        y="75"
        width="400"
        height="200"
        ry="20"
        fill="red"
        stroke="white"     
        stroke-width="7"/>
        <polygon 
        class="animate__animated animate__heartBeat animate__infinite"
        points="215,135 215,210 315,175"
        fill="white"/>
    </svg>
    <svg class="item animate__animated animate__tada animate__infinite" viewBox="0 0 100 100" width="100" height="100">
        <circle cx="50" cy="50" r="40"></circle>
       <line class="cross animate__animated animate__swing animate__infinite"
    x1="30"
    y1="30"
    x2="70"
    y2="70"
    stroke="black"
    stroke-width="5"
  />
  <line class="cross animate__animated animate__wobble animate__infinite"
    x1="70"
    y1="30"
    x2="30"
    y2="70"
    stroke="black"
    stroke-width="5"
  />
    </svg>
    
</body>
</html>
